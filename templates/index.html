
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            color: #1565c0;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            background: #1565c0;
            color: white;
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        img {
            width: 200px;
            max-width: 100%;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>QR Code Generator</h1>

        <p>Enter text or a URL to generate your QR code.</p>

        <form method="POST">
            <input
                type="text"
                name="text"
                placeholder="Enter text or URL"
                value="{{ text }}"
                required
            >

            <br>

            <button type="submit">Generate QR Code</button>
        </form>

        {% if qr_image %}
            <h3>Your QR Code</h3>

            <img
                src="data:image/png;base64,{{ qr_image }}"
                alt="Generated QR Code"
            >

            <br>

            <a
                href="data:image/png;base64,{{ qr_image }}"
                download="qrcode.png"
            >
                Download QR Code
            </a>
        {% endif %}
    </div>
</body>
</html>
